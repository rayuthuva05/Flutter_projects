name: flutter_store_app
description: "Flutter storefront for the Laravel ecommerce backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  flutter_map: ^7.0.2
  google_fonts: ^6.3.1
  latlong2: ^0.9.1
  retrofit: ^4.7.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  retrofit_generator: ^10.0.2

flutter:
  uses-material-design: true
